services:
  db:
    image: postgres:16
    container_name: mbg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbg
      POSTGRES_PASSWORD: mbg_password
      POSTGRES_DB: db_mbg
    ports:
      - "5432:5432"
    volumes:
      - mbg_db_data:/var/lib/postgresql/data
      - ./db_schema_pg.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbg -d db_mbg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mbg_db_data: